<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relation Properties Checker</title>
        
<linkhref="https://fonts.googleapis.com/css2?family=Lora:wght@600&family=Nunito:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="container">
        <h2>✨ Relation Properties Checker ✨</h2>
        <label>Enter Set Elements (comma separated):</label>
        <input type="text" id="setElements" placeholder="e.g., 1,2,3">
        
        <label>Enter Relations (comma separated pairs, e.g., (1,2),(2,3)):</label>
        <textarea id="relations" rows="3"></textarea>
        
        <button onclick="checkProperties()">Check Properties</button>
        
        <h3>Results:</h3>
        <div id="results"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
